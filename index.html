<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Can You Run a Sustainable Restaurant?</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2a26;--mute:#6b675c;--line:#e3dccb;--green:#2f7d4f;--gold:#d9962b;--red:#c4452f;--blue:#2d6a9f;--accent:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1a;--card:#262823;--ink:#f1ede2;--mute:#a9a597;--line:#3a3c35;--green:#5fbf86;--gold:#e8b04f;--red:#ef7b66;--blue:#6fb0e3;--accent:#5fbf86}}
:root[data-theme="dark"]{--bg:#1c1d1a;--card:#262823;--ink:#f1ede2;--mute:#a9a597;--line:#3a3c35;--green:#5fbf86;--gold:#e8b04f;--red:#ef7b66;--blue:#6fb0e3;--accent:#5fbf86}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3,button,.chip,.lbl{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
h1{font-size:2rem;line-height:1.15;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 0 var(--line)}
.hero{background:linear-gradient(135deg,#2f7d4f,#1f5a37);color:#fff;border:0;text-align:center;padding:34px 20px}
.hero p{color:#e8f5ec}.emoji{font-size:3.2rem}
button{font-size:1rem;cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:var(--accent);color:#fff;font-weight:700}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:default}
.hero button{background:#fff;color:#1f5a37;font-size:1.1rem}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lbl{font-size:.78rem;font-weight:700;color:var(--mute);display:flex;justify-content:space-between}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.fill{height:100%;border-radius:6px;transition:width .7s,background .4s}
.prog{font-family:"Trebuchet MS",Arial,sans-serif;font-size:.85rem;color:var(--mute);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:rgba(47,125,79,.12);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:.85rem}
.chip b{color:var(--accent)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);margin:10px 0;padding:14px 16px;font-weight:400;font-family:Georgia,serif;font-size:1rem}
.opt:hover{border-color:var(--accent)}
.opt small{display:block;color:var(--mute);font-family:"Trebuchet MS",Arial,sans-serif;margin-top:4px}
.fb{border-left:6px solid var(--gold);padding:10px 16px;background:rgba(217,150,43,.12);border-radius:8px;margin:14px 0}
.deltas{display:flex;gap:10px;flex-wrap:wrap;font-family:"Trebuchet MS",Arial,sans-serif;font-weight:700;margin:8px 0}
.up{color:var(--green)}.down{color:var(--red)}
.tag{font-family:"Trebuchet MS",Arial,sans-serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
textarea{width:100%;min-height:130px;font:inherit;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-size:3rem;text-align:center}
ul.log{padding-left:18px}ul.log li{margin:6px 0}
.hide{display:none}
img.pic{width:100%;border-radius:12px;margin:14px 0;display:block}
.sim{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sim .em{font-size:2.4rem}.sim p{margin:.2em 0;color:var(--mute)}
.ok{color:var(--green);font-family:"Trebuchet MS",Arial,sans-serif;font-weight:700}
footer{max-width:760px;margin:0 auto;padding:18px 16px 30px;text-align:center;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-size:1.05rem;font-weight:700;color:var(--mute);border-top:1px solid var(--line)}
</style></head><body><div class="wrap" id="app"></div>
<footer>Nannestad High School – Barbara Anna Zielonka</footer>

var R=[
{t:"Week 1 · The Bins",e:"🗑️",s:"You open the kitchen door and see four overflowing bins. Your sous chef says, “We throw away about a third of what we buy.” Your owner wants you to act this week.",k:[["food waste","food that is thrown away"],["audit","a careful check"],["portion","the amount of food on one plate"]],o:[
["Start a waste audit: weigh and record everything that goes in the bin.","Costs staff time, but gives you facts.",[-5,0,+10],"Smart. You now know the top three wasted items: bread, salad and rice. Good managers measure before they decide."],
["Cut all portions by 30% straight away.","Quick and cheap.",[+8,-15,+5],"Some guests complain that the plate looks “mean”. You saved food, but you did not find the real problem."],
["Do nothing. Waste is normal in restaurants.","No cost.",[0,-3,-8],"The bins stay full. The owner is not impressed, and the waste costs you money every day."]]},
{t:"Week 2 · The Energy Bill",e:"💡",s:"The electricity bill has arrived and it is 25% higher than last year. You notice that ovens, lights and the extractor fan run all day, even in the quiet hours.",k:[["energy-efficient","uses less energy to do the same job"],["invest","spend money now to gain later"],["bill","a paper or message that says how much you must pay"]],o:[
["Buy new energy-efficient ovens and fridges.","Big cost now, big savings later.",[-25,+2,+15],"Excellent for the planet, but your budget takes a hit. The savings will come slowly over the next years."],
["Install timers and LED lights, and teach staff to switch off equipment.","Small cost, fast result.",[-6,0,+12],"A clever low-cost move. The bill drops already next month, and staff feel part of the team."],
["Ask the staff to “try to save energy” but change nothing else.","Free, but vague.",[0,0,+2],"Good intentions, small results. People need clear rules, not just a nice request."]]},
{t:"Week 3 · The Supplier",e:"🚚",s:"Your usual supplier delivers cheap tomatoes from far away, wrapped in plastic. A local farm, 30 km away, offers seasonal vegetables with no plastic, but at a higher price.",k:[["local","from the area close to you"],["seasonal","grown at the right time of year"],["carbon footprint","the CO₂ made by an activity"]],o:[
["Switch fully to the local farm.","Higher price, fresher food.",[-12,+10,+14],"Guests taste the difference and post pictures online. A strong story for your menu: “From farm to fork”."],
["Buy half local, half from the old supplier.","A balanced plan.",[-5,+4,+7],"A sensible compromise. You can increase the local share later when you know the real costs."],
["Stay with the cheap supplier.","Lowest price.",[+6,-3,-8],"You save money today, but your carbon footprint stays high and the plastic waste continues."]]},
{t:"Week 4 · Talk to Your Team",e:"✉️",s:"You must send a short message to all kitchen and service staff about the new green plan. Which message works best? Think about tone, clarity and respect.",k:[["motivate","make people want to do something"],["target","a goal you want to reach"],["register","how formal or informal your language is"]],o:[
["“You are all wasting food and it must stop NOW. Anyone who ignores this will be in trouble.”","Strict and angry.",[0,-5,-4],"This message blames people and creates fear. Staff become defensive and morale drops. Tone matters in the workplace."],
["“Hi team! We want to cut food waste by 20% in two months. Your ideas are welcome. Let’s talk at Monday’s meeting.”","Clear, positive, polite.",[0,+4,+10],"Great! It has a clear target, a time frame and an invitation. Positive, polite English motivates people."],
["“Hey guys, maybe we could possibly try to waste a bit less food, if that’s okay, sorry.”","Too soft and unclear.",[0,0,+1],"Polite, but there is no target and no action. Staff will not know what you really want."]]},
{t:"Week 5 · The Online Review",e:"⭐",s:"A guest writes online: “Lovely food, but too much plastic packaging on the takeaway. Not very eco-friendly!” Many people can see it. How do you reply?",k:[["feedback","comments about how well you did"],["takeaway","food you take home to eat"],["compostable","can break down naturally into soil"]],o:[
["“Thank you for your honest feedback. From next week we will use compostable boxes. We hope to see you again!”","Thankful and specific.",[-6,+12,+10],"A professional reply: thank, take action, invite them back. Other guests see that you listen."],
["“Our packaging is fine. Nobody else has complained.”","Defensive.",[+2,-14,-3],"Arguing with guests in public hurts your reputation. Feedback is a free chance to improve."],
["No reply. Delete the review if possible.","Avoid the problem.",[0,-6,-2],"The review stays online and guests notice the silence. Ignoring feedback rarely helps."]]},
{t:"Week 6 · Surplus Food",e:"🥖",s:"On Saturday night you have lots of good food left: bread, soup and salads. It is safe to eat, but the restaurant is closing. What do you do with the surplus?",k:[["surplus","extra food that is not needed"],["donate","give for free to help others"],["hygiene","keeping food and places clean and safe"]],o:[
["Sell it cheaply through a “last-minute” food app.","Small income, no waste.",[+8,+6,+10],"A win-win-win: guests get a bargain, you earn money and the food is eaten. Remember hygiene and allergy information."],
["Donate it to a local charity that follows food-safety rules.","Helps the community.",[-2,+8,+12],"Wonderful for your image and the community. Check storage and hygiene rules first, because safety comes before kindness."],
["Throw it away. It is easier.","Zero effort.",[0,-2,-10],"Perfectly good food ends up in the bin, which brings you right back to Week 1."]]}
];

function next(){S.r++;if(S.r>=R.length)return fin();var q=R[S.r];
var h=meters()+'<div class="prog">Step '+(S.r+1)+' of '+R.length+'</div><div class="card"><span class="tag">'+q.t+'</span><div class="big">'+q.e+'</div><p>'+q.s+'</p><div class="chips">';
q.k.forEach(function(k){h+='<span class="chip"><b>'+k[0]+'</b>: '+k[1]+'</span>'});
h+='</div><h3>What do you do?</h3>';
q.o.forEach(function(o,i){var dis=o[4]!==undefined&&o[4]>S.bud;h+='<button class="opt" '+(dis?'disabled':'')+' onclick="pick('+i+')">'+o[0]+'<small>'+o[1]+(dis?' · Not enough money left':'')+'</small></button>'});
draw(h+'</div>')}
function pick(i){var q=R[S.r],o=q.o[i],d=o[2];
S.bud=clamp(S.bud+d[0]);S.cus=clamp(S.cus+d[1]);S.eco=clamp(S.eco+d[2]);
S.log.push({w:q.t,c:o[0]});q.k.forEach(function(k){ALLW.push(k[0])});
function f(n,l,m){var v=m?n*50:n;return '<span class="'+(n>0?'up':n<0?'down':'')+'">'+l+' '+(v>0?'+':'')+(m?'€':'')+v+'</span>'}
draw(meters()+'<div class="card"><span class="tag">'+q.t+'</span><p><b>You chose:</b> '+o[0]+'</p><div class="deltas">'+f(d[0],'💰 Budget',mon())+f(d[1],'😊 Guests')+f(d[2],'🌱 Eco')+'</div><div class="fb">'+o[3]+'</div><button onclick="next()">'+(S.r==R.length-1?'See your result →':'Continue →')+'</button></div>')}
function fin(){var ok=S.cus>40&&S.eco>=60&&(mon()||S.bud>40),m=Math.min(S.bud,S.cus),title,txt,em;
if(ok){title="Sustainable Star";em="🏆";txt="You balanced money, guests and the planet like a true professional."}
else if(S.eco>=60){title="Green but Struggling";em="🌿";txt="The planet wins, but guests or money are suffering. A sustainable business must also survive."}
else if(m>=50){title="Profitable but Not Green";em="💼";txt="Guests are happy and money is safe, but your eco impact is still high. Small green steps make a difference."}
else{title="Back to the Kitchen";em="🔥";txt="The pressure was high this time. Real professionals learn from mistakes. Try again with new choices!"}
DONE[S.cur]={title:title,log:S.log};
var h=meters()+'<div class="card hero"><div class="emoji">'+em+'</div><h2>'+title+'</h2><p>'+txt+'</p></div><div class="card"><h3>Your decisions</h3><ul class="log">';
S.log.forEach(function(l){h+='<li><b>'+l.w.split(" · ").pop()+':</b> '+l.c+'</li>'});
draw(h+'</ul><button onclick="hub()">Back to simulations →</button></div>')}
function report(){var h='<div class="card hero"><div class="emoji">🎓</div><h2>Final report</h2><p>You completed '+DONE.filter(Boolean).length+' simulations.</p></div><div class="card"><h3>Your results</h3><ul class="log">';
DONE.forEach(function(d,i){if(d)h+='<li><b>'+SIMS[i].n+':</b> '+d.title+'</li>'});
h+='</ul></div><div class="card"><span class="tag">Final task · writing</span><h3>Write a short report to the owner</h3><p>Write 4–6 sentences. Use at least <b>four</b> key words from the simulations. Explain your best decision and one thing you would change.</p><p class="prog">Sentence starters: <i>My most important decision was… · This helped because… · If I could start again, I would… · In the future, the restaurant should…</i></p><textarea id="rep" placeholder="Dear Owner, …" oninput="wc()"></textarea><div class="row"><span class="prog" id="wc">0 words · 0 key words used</span><button onclick="cp()">Copy my report</button></div></div><div class="card"><button class="ghost" onclick="hub()">← Back to simulations</button></div>';
draw(h)}
function wc(){var t=document.getElementById("rep").value,w=t.trim()?t.trim().split(/\s+/).length:0,u=0,l=t.toLowerCase(),seen={};
ALLW.forEach(function(x){if(!seen[x]&&l.indexOf(x.toLowerCase())>-1){seen[x]=1;u++}});
document.getElementById("wc").textContent=w+" words · "+u+" key words used"}
function cp(){var t=document.getElementById("rep");t.select();try{document.execCommand("copy");document.getElementById("wc").textContent="Copied! Paste it into your document or OneNote."}catch(e){document.getElementById("wc").textContent="Select the text and copy it manually."}}
start();
</script></body></html>
